services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: api
    environment:
      REMOTE_CONFIG_HTTP_ADDR: ":8080"
      REMOTE_CONFIG_REDIS_ADDR: "redis:6379"
      REMOTE_CONFIG_JWT_SECRET: "dev-secret"
      REMOTE_CONFIG_LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
